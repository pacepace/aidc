[project]
name = "aidc-mcp"
version = "1.9.10"
description = "aidc control plane: MCP server exposing aidc CLI as tools + resources"
requires-python = ">=3.14"
dependencies = [
    # The MCP SDK's floor (TRS-02: 2.x only). aidc imports none of it: 3tears-mcp serves the
    # tools over it. Named so a re-lock cannot take a 2.x below the floor 1.x was tested on.
    "mcp>=2.3,<3",
    "httpx>=0.27",
    # Imported directly (auth.py, server.py), not just transitively via 3tears-mcp.
    # uvicorn[standard] keeps the uvloop/httptools speedups the shipped image runs.
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5",
    # The 3tears family (TRS-02, TRS-17): local mode is the MCP server, the tool schemas,
    # observability and the TearsTool contract with its MCP face, and nothing of the platform
    # (no NATS, Postgres driver, LangGraph or LangChain). Every 3tears package is one minor.
    "3tears-mcp>=0.95,<0.96",
    "3tears-tool-contract[mcp]>=0.95,<0.96",
    "3tears-tool-schema>=0.95,<0.96",
    "3tears-observe>=0.95,<0.96",
    # aidc-mcp's durable state on the 3tears SQLite L3 (TRS-25). 3tears core brings asyncpg
    # (the store's refusals are asyncpg's error types) and SQLAlchemy; nothing connects to
    # Postgres, and no NATS client is installed (owner ruling 2026-11-26, TRS-01/TRS-17).
    "3tears>=0.95,<0.96",
]

[project.optional-dependencies]
# Mesh mode's dependencies (TRS-17): the 3tears ToolServer, registry and audit. Empty until
# the mesh face is built.
mesh = []
# Tracing export (AIDC_MCP_OTEL_ENDPOINT, OTLP/HTTP) and metrics (AIDC_MCP_METRICS); both off
# unless configured, and not in the default image (TRS-14).
otel = ["3tears-observe[otel-http]>=0.95,<0.96"]
prometheus = ["prometheus-client>=0.20"]
dev = [
    # the export paths are tested too
    "3tears-observe[otel-http]>=0.95,<0.96",
    "prometheus-client>=0.20",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests use long inline fixtures/assertions and the compact `a = x; b = y`
# setup idiom on purpose; enforcing line-length / no-semicolons there is noise.
"tests/**" = ["E501", "E702"]

[tool.mypy]
ignore_missing_imports = true

[tool.uv]
# Supply-chain cooldown (REL-09): never resolve a version uploaded in the last 14 days.
# Most malicious releases (a hijacked maintainer account, a typosquat) are found and
# pulled within days; waiting two weeks lets that happen before we install anything.
# A fix that needs to land sooner is an explicit, reviewed exception:
# `exclude-newer-package` for that one package, with the reason beside it.
exclude-newer = "14 days"
# Security floors for transitive dependencies (not imported here): a re-lock must fail
# to resolve rather than quietly return to a vulnerable version. certifi >= 2026.10.19
# drops the `emSign ECC Root CA - G3` root (GHSA-6q48-6c7w-9gw2, critical). PyJWT comes
# in via mcp; certifi via httpx/httpcore.
# PyJWT < 2.15.0: GHSA-x33g-cr3x-6449, GHSA-42vr-xj54-vc7v and the 2.14.0 batch.
constraint-dependencies = [
    "pyjwt>=2.15.0",
    "certifi>=2026.10.19",
]

# The 3tears family comes from one pushed commit of its unreleased branch, so the lock, the
# image build and every machine get the same code: aidc is tested on unreleased 3tears before
# 3tears is released (owner ruling 2026-11-26). Every 3tears package, the transitive ones
# included, names the same rev; tests/test_dependencies.py fails when they differ. These move
# to released versions before aidc 2.0 ships.
[tool.uv.sources]
3tears-mcp = { git = "https://github.com/pacepace/3tears", rev = "1378d2e9a540cdef98b28c93dd03d40402054469", subdirectory = "packages/mcp" }
3tears-tool-contract = { git = "https://github.com/pacepace/3tears", rev = "1378d2e9a540cdef98b28c93dd03d40402054469", subdirectory = "packages/tool-contract" }
3tears-tool-schema = { git = "https://github.com/pacepace/3tears", rev = "1378d2e9a540cdef98b28c93dd03d40402054469", subdirectory = "packages/tool-schema" }
3tears-observe = { git = "https://github.com/pacepace/3tears", rev = "1378d2e9a540cdef98b28c93dd03d40402054469", subdirectory = "packages/observe" }
3tears = { git = "https://github.com/pacepace/3tears", rev = "1378d2e9a540cdef98b28c93dd03d40402054469", subdirectory = "packages/core" }
3tears-interfaces = { git = "https://github.com/pacepace/3tears", rev = "1378d2e9a540cdef98b28c93dd03d40402054469", subdirectory = "packages/interfaces" }
3tears-nats = { git = "https://github.com/pacepace/3tears", rev = "1378d2e9a540cdef98b28c93dd03d40402054469", subdirectory = "packages/nats" }
