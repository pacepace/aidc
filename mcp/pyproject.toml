[project]
name = "aidc-mcp"
version = "1.9.6"
description = "aidc control plane: MCP server exposing aidc CLI as tools + resources"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "httpx>=0.27",
    # Imported directly (auth.py / server.py / tools.py), not just transitively via mcp.
    # uvicorn[standard] keeps the uvloop/httptools speedups the shipped image runs.
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests use long inline fixtures/assertions and the compact `a = x; b = y`
# setup idiom on purpose; enforcing line-length / no-semicolons there is noise.
"tests/**" = ["E501", "E702"]

[tool.mypy]
ignore_missing_imports = true

[tool.uv]
# Supply-chain cooldown (REL-09): never resolve a version uploaded in the last 14 days.
# Most malicious releases (a hijacked maintainer account, a typosquat) are found and
# pulled within days; waiting two weeks lets that happen before we install anything.
# A fix that needs to land sooner is an explicit, reviewed exception:
# `exclude-newer-package` for that one package, with the reason beside it.
exclude-newer = "14 days"
# Reviewed exception: certifi 2026.10.19 (uploaded 2026-10-20) drops the emSign roots
# whose intermediate CA keys were compromised (GHSA-6q48-6c7w-9gw2, critical); every
# earlier certifi carries them. The cutoff admits that release and nothing later, and
# lapses on its own once 2026.10.19 is past the 14-day window (2026-11-03); drop it then.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
# Security floors for transitive dependencies (not imported here): a re-lock, or the
# exception above being dropped early, must fail to resolve rather than quietly
# return to a vulnerable version. PyJWT comes in via mcp; certifi via httpx/httpcore.
# PyJWT < 2.15.0: GHSA-x33g-cr3x-6449, GHSA-42vr-xj54-vc7v and the 2.14.0 batch.
constraint-dependencies = [
    "pyjwt>=2.15.0",
    "certifi>=2026.10.19",
]
